name: Auto-Deploy All Functions

on:
  push:
    branches:
      - main

jobs:
  deploy-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Automatically Discover and Deploy Functions
        run: |
          echo "Scanning repository for main.py files..."
          
          for file in $(find . -name "main.py" -not -path "*/.*" -not -path "./venv/*" -not -path "./.venv*/*"); do
            dir=\((dirname "\)file")
            dir=${dir#./}
            
            if [ -z "\(dir" ] || [ "\)dir" = "." ]; then
              continue
            fi
            
            echo "--------------------------------------------------"
            echo "Found main.py in directory: '$dir'"
            
            if [ "$dir" == "landing" ]; then
              FUNC_NAME="petrol-scraper-func"
            else
              FUNC_NAME="petrol-scraper-$dir"
            fi
            
            echo "Deploying to GCP as: \(FUNC_NAME using source folder:\)dir"
            
            gcloud functions deploy "$FUNC_NAME" \
              --gen2 \
              --runtime=python314 \
              --region=europe-west1 \
              --source="$dir" \
              --entry-point=main \
              --trigger-http \
              --allow-unauthenticated \
              --project=petrol-webscrape \
              --timeout=1800s
              
            echo "Successfully deployed $FUNC_NAME!"
          done
          echo "--------------------------------------------------"
          echo "All functions processed successfully."