name: Auto-Deploy All Functions

on:
  push:
    branches:
      - main

jobs:
  deploy-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Discover and Deploy Functions via Python
        run: |
          python - <<'EOF'
          import os
          import subprocess

          print("Scanning repository for main.py files...")
          for root, dirs, files in os.walk("."):
              # Skip hidden folders, git, and virtual environments (.venv, venv, etc.)
              path_parts = root.split(os.sep)
              if any(part.startswith('.') or 'venv' in part for part in path_parts):
                  continue
              
              if "main.py" in files:
                  dir_name = root.lstrip("./").lstrip(os.sep)
                  if not dir_name:
                      continue
                  
                  print("--------------------------------------------------")
                  print(f"Found main.py in directory: '{dir_name}'")
                  
                  # Map folder names to GCP function names
                  if dir_name == "landing":
                      func_name = "petrol-scraper-func"
                  else:
                      func_name = f"petrol-scraper-{dir_name}"
                      
                  print(f"Deploying to GCP as: {func_name} using source folder: {dir_name}")
                  
                  cmd = [
                      "gcloud", "functions", "deploy", func_name,
                      "--gen2",
                      "--runtime=python314",
                      "--region=europe-west1",
                      f"--source={dir_name}",
                      "--entry-point=run_pipeline",
                      "--trigger-http",
                      "--allow-unauthenticated",
                      "--project=petrol-webscrape",
                      "--timeout=1800s"
                  ]
                  
                  result = subprocess.run(cmd)
                  if result.returncode != 0:
                      print(f"Error: Deployment failed for {func_name}")
                      exit(1)
                  else:
                      print(f"Successfully deployed {func_name}!")
                      
          print("--------------------------------------------------")
          print("All functions processed successfully.")
          EOF